[package]
name = "bridge-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Pulls in alloy for the on-chain Gate bindings (used by validator/keeper).
# `alloy-primitives/k256` enables ECDSA recovery so the store can authenticate
# signatures (recover signer) and recompute submissionIds at the trust boundary.
abi = ["dep:alloy", "alloy-primitives/k256"]
# HTTP client for the sig-store service (used by validator/keeper in Phase 7).
http = ["dep:reqwest"]
# Shared bearer-token axum middleware for the operator/admin HTTP surfaces
# (validator's operator API, sig-store).
axum-auth = ["dep:axum"]

[dependencies]
alloy-primitives = { workspace = true }
alloy = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true, optional = true }
axum = { workspace = true, optional = true }

[dev-dependencies]
# Loopback mock server for the `remote` client's timeout/body-cap tests.
tokio = { workspace = true }
