[package]
name = "bridge-db"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# `abi` gives us the trust-boundary checks (id<->params binding + signature
# recovery) we reuse verbatim from the file store, plus `debridge_id` derivation.
bridge-core = { workspace = true, features = ["abi"] }
alloy-primitives = { workspace = true }
sqlx = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Live-Postgres tests (tests/live_pg.rs), gated on BRIDGE_TEST_DATABASE_URL.
alloy = { workspace = true }
hex = { workspace = true }
