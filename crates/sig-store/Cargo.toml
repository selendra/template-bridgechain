[package]
name = "sig-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The Postgres source of truth. A bearer token (SIG_STORE_TOKEN) authenticates
# the HTTP boundary; bridge-db ALSO reuses bridge-core's trust-boundary
# validation (id<->params binding + signature authentication) as defense in
# depth, so even an authenticated client can't forge a record or signature.
bridge-core = { workspace = true, features = ["axum-auth"] }
bridge-db = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
# Drive the auth-layered router in-process (no DB / no socket) via `oneshot`.
tower = { version = "0.5", features = ["util"] }
# The live-Postgres test (gated on BRIDGE_TEST_DATABASE_URL) signs a real record.
bridge-core = { workspace = true, features = ["axum-auth", "abi"] }
alloy = { workspace = true }
alloy-primitives = { workspace = true }
hex = { workspace = true }
